<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkmate — problem slide chat</title>
<style>
  :root {
    --blue: #269DFD;
    --gray: #E2E2E3;
    --bg: #FDFDFD;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
    overflow: hidden;
  }
  /* Bottom-anchored chat list, pushed up as messages arrive. */
  .chat {
    position: absolute;
    left: 0; right: 0; bottom: 6vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.3, 1);
  }
  .row {
    display: flex;
    margin-top: 28px;
  }
  .row.same { margin-top: 16px; }
  .row.in  { justify-content: flex-start; }
  .row.out { justify-content: flex-end; }

  .bubble {
    position: relative;
    max-width: 515px;
    padding: 17.6px 25.5px;
    border-radius: 39.2px;
    font-size: 29.4px;
    line-height: 1.2;
    letter-spacing: 1.18px;
    word-break: break-word;
    animation: pop 0.42s cubic-bezier(0.2, 1.25, 0.4, 1) both;
  }
  .in  .bubble { background: var(--gray); color: #000; transform-origin: bottom left; }
  .out .bubble { background: var(--blue); color: #fff; transform-origin: bottom right; }

  .tail {
    position: absolute;
    width: 47px;
    height: 27.4px;
    bottom: -9.8px;
  }
  .in  .tail { left: 0; }
  .out .tail { right: 0; }

  @keyframes pop {
    0%   { transform: scale(0.4); opacity: 0; }
    70%  { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Typing indicator */
  .typing .bubble { padding: 24px 28px; }
  .dots { display: flex; gap: 9px; }
  .dots span {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #9B9B9F;
    animation: blink 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  .divider {
    margin-top: 52px;
    text-align: center;
    font-size: 21px;
    letter-spacing: 0.6px;
    color: #ADADAF;
    animation: fade 0.7s ease both;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .hint {
    position: fixed;
    bottom: 10px; right: 14px;
    font-size: 12px;
    color: #D5D5D5;
    user-select: none;
  }
</style>
</head>
<body>
<div class="stage"><div class="chat" id="chat"></div></div>
<div class="hint">R — replay</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <path id="tail-in"  d="M45.3555 11.644C35.0862 19.8927 27.9127 22.8164 16.4594 26.1098C15.2728 26.451 14.3963 24.9078 15.2153 23.9839C19.7738 18.8421 21.1755 13.4699 16.1829 2.53665C15.7495 1.58754 16.6432 0.539973 17.6367 0.858723L44.9788 9.63099C45.862 9.91434 46.0786 11.0632 45.3555 11.644Z"/>
    <path id="tail-out" d="M1.66202 11.644C11.9313 19.8927 19.1048 22.8164 30.5581 26.1098C31.7447 26.451 32.6213 24.9078 31.8022 23.9839C27.2438 18.8421 25.8421 13.4699 30.8346 2.53665C31.268 1.58754 30.3744 0.539973 29.3809 0.858723L2.03873 9.63099C1.15558 9.91434 0.938911 11.0632 1.66202 11.644Z"/>
  </defs>
</svg>

<script>
  // side: "in" = gray (them), "out" = blue (you)
  const script = [
    { side: "in",  text: "are you done with work? 🥹", typing: 1300 },
    { side: "out", text: "yeahhh just got out, so tired", delay: 1400 },
    { side: "in",  text: "can you grab milk on your way back?", typing: 1500 },
    { side: "out", text: "yep sure!", delay: 1200 },
    { side: "in",  text: "also did the landlord reply about the heater??", typing: 1700 },
    { side: "out", text: "nope 😭 I’ll chase him again tonight", delay: 1600 },
    { side: "in",  text: "ugh ok. dinner’s on me, come fast!", typing: 1400 },
    { side: "out", text: "omw!!", delay: 1100 },
    { divider: "later that night", delay: 1800 },
    { side: "in",  text: "…there’s no milk for tomorrow morning, is there", typing: 1900 },
    { side: "out", text: "NOOO I completely forgot 🤦 walked right past the store", delay: 1700 },
    { side: "in",  text: "third time this week 😅", typing: 1500 },
  ];

  const chat = document.getElementById("chat");
  let timers = [];
  const wait = (ms) => new Promise((r) => timers.push(setTimeout(r, ms)));

  function tailSVG(kind, fill) {
    return `<svg class="tail" viewBox="0 0 47.0175 27.4269" preserveAspectRatio="none">
      <use href="#tail-${kind}" fill="${fill}"/></svg>`;
  }

  function bubbleRow(side, inner, same, isTyping = false) {
    const row = document.createElement("div");
    row.className = `row ${side}${same ? " same" : ""}${isTyping ? " typing" : ""}`;
    const fill = side === "in" ? "#E2E2E3" : "#269DFD";
    row.innerHTML = `<div class="bubble">${inner}${tailSVG(side, fill)}</div>`;
    return row;
  }

  // Append while sliding existing messages up smoothly: offset the list down
  // by the new element's height, then transition back to 0.
  function slideIn(el) {
    chat.appendChild(el);
    const h = el.getBoundingClientRect().height +
      parseFloat(getComputedStyle(el).marginTop);
    chat.style.transition = "none";
    chat.style.transform = `translateY(${h}px)`;
    void chat.offsetHeight;
    chat.style.transition = "transform 0.45s cubic-bezier(0.25, 0.8, 0.3, 1)";
    chat.style.transform = "translateY(0)";
  }

  // Used when a typing indicator is swapped for the real message,
  // so the list doesn't double-shift.
  const appendInPlace = (el) => chat.appendChild(el);

  async function play() {
    timers.forEach(clearTimeout);
    timers = [];
    chat.innerHTML = "";
    let prevSide = null;
    await wait(900);

    for (const step of script) {
      if (step.divider) {
        await wait(step.delay || 1500);
        const d = document.createElement("div");
        d.className = "divider";
        d.textContent = `— ${step.divider} —`;
        slideIn(d);
        prevSide = null;
        continue;
      }

      const same = prevSide === step.side;

      if (step.side === "in") {
        const t = bubbleRow("in", `<div class="dots"><span></span><span></span><span></span></div>`, same, true);
        slideIn(t);
        await wait(step.typing || 1300);
        t.remove();
        chat.style.transition = "none";
        chat.style.transform = "translateY(0)";
        appendInPlace(bubbleRow(step.side, step.text, same));
      } else {
        await wait(step.delay || 1300);
        slideIn(bubbleRow(step.side, step.text, same));
      }
      prevSide = step.side;
      await wait(500);
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "r") play();
  });
  play();
</script>
</body>
</html>
