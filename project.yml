name: Checkmate
options:
  bundleIdPrefix: com.madhurima
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES

targets:
  Checkmate:
    type: application
    platform: iOS
    sources:
      - Checkmate
    info:
      path: Checkmate/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSContactsUsageDescription: Checkmate uses contacts so you can assign todos to people you know.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - checkmate
    entitlements:
      path: Checkmate/Checkmate.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.madhurima.checkmate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhurima.checkmate
    dependencies:
      - package: Supabase
      - target: CheckmateWidget
        embed: true
      - target: CheckmateMessages
        embed: true

  CheckmateWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CheckmateWidget
      - path: Checkmate/Models
        includes:
          - Task.swift
          - StickyColor.swift
      - path: Checkmate/Services
        includes:
          - AppGroupStore.swift
    info:
      path: CheckmateWidget/Info.plist
      properties:
        CFBundleDisplayName: Checkmate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CheckmateWidget/CheckmateWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.madhurima.checkmate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhurima.checkmate.widget
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  CheckmateMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: CheckmateMessages
      - path: Checkmate/Models
        includes:
          - StickyColor.swift
      - path: Checkmate/Views
        includes:
          - Theme.swift
    info:
      path: CheckmateMessages/Info.plist
      properties:
        CFBundleDisplayName: Checkmate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    entitlements:
      path: CheckmateMessages/CheckmateMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.madhurima.checkmate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhurima.checkmate.messages
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  CheckmateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CheckmateUITests
    dependencies:
      - target: Checkmate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhurima.checkmate.uitests
        TEST_TARGET_NAME: Checkmate
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Checkmate:
    build:
      targets:
        Checkmate: all
        CheckmateWidget: all
        CheckmateMessages: all
    run:
      config: Debug
    test:
      targets:
        - CheckmateUITests
