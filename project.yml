name: Checkmate
options:
  bundleIdPrefix: com.madhurima
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES

targets:
  Checkmate:
    type: application
    platform: iOS
    sources:
      - Checkmate
    info:
      path: Checkmate/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSContactsUsageDescription: Checkmate uses contacts so you can assign todos to people you know.
    entitlements:
      path: Checkmate/Checkmate.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhurima.checkmate
    dependencies:
      - package: Supabase
      - target: CheckmateWidget
        embed: true

  CheckmateWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CheckmateWidget
      - path: Checkmate/Models
        includes:
          - Task.swift
          - StickyColor.swift
      - path: Checkmate/Services
        includes:
          - AppGroupStore.swift
    info:
      path: CheckmateWidget/Info.plist
      properties:
        CFBundleDisplayName: Checkmate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CheckmateWidget/CheckmateWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhurima.checkmate.widget
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  Checkmate:
    build:
      targets:
        Checkmate: all
        CheckmateWidget: all
    run:
      config: Debug
